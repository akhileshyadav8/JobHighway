[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhighway-backend"
version = "0.1.0"
description = "JobHighway Backend - A near real-time job discovery engine"
authors = [
    {name = "Akhilesh"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "google-generativeai>=0.8.0",
    "tenacity>=8.3.0",
    "structlog>=24.1.0",
    "python-slugify>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
