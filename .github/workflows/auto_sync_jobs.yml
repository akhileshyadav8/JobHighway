name: Automatic Real-Time Job Discovery & Sync

on:
  schedule:
    # Runs every 6 hours (4 times daily) to keep job database fresh without exhausting Vercel deployment resources
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions UI anytime
  repository_dispatch: # Allows instant zero-delay trigger via webhook / external pinger
    types: [sync_jobs, zero_delay_sync]

jobs:
  sync-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sqlalchemy psycopg2-binary python-dotenv requests

      - name: Run Real-Time Job Ingestion from Worldwide ATS & Adzuna APIs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          python backend/scripts/sync_real_production_jobs.py

      - name: Commit and Push Updated Job Data
        run: |
          git config --global user.name "JobHighway Bot"
          git config --global user.email "bot@jobhighway.internal"
          git add frontend/src/lib/real_jobs.json
          if git diff --staged --quiet; then
            echo "No new JSON file changes to commit."
          else
            git commit -m "chore(sync): auto-sync latest 30-day verified job postings [skip ci]"
            git pull --rebase origin main || true
            git push origin main || (git pull --rebase origin main && git push origin main)
          fi
